<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HandWStat Studio</title>
    <base href="/" />
    <script src="js/handwstat.js"></script>
    <link rel="stylesheet" href="_content/Blazor-ApexCharts/css/apexcharts.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="HandWStat.styles.css" />
    <meta name="theme-color" content="#071412" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23071412'/><path d='M5 23 10 10l6 13 6-13 5 13M4 26h24' fill='none' stroke='%23ff5b2e' stroke-width='2.5'/></svg>">
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="studio-boot">
            <div class="studio-boot__mark" aria-hidden="true">
                <svg viewBox="0 0 64 64">
                    <path d="M8 45 19 18l13 27 13-27 11 27"></path>
                    <path d="M7 51h50"></path>
                    <circle cx="32" cy="11" r="4"></circle>
                </svg>
            </div>
            <div>
                <strong>HandWStat Studio</strong>
                <span>Initialisation du poste de performance</span>
            </div>
            <div class="studio-boot__progress"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        Le studio a rencontre une erreur.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">Fermer</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
